name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npx expo prebuild --platform android --no-install
      - name: Gömülü paketleri APK içine koy
        run: |
          mkdir -p android/app/src/main/assets/bundle
          cp *.p[0-9][0-9] android/app/src/main/assets/bundle/
          ls -la android/app/src/main/assets/bundle
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HafizDunyasi-apk
          path: android/app/build/outputs/apk/release/*.apk
