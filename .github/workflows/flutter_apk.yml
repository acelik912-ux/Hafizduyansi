name: Flutter APK (telefona kurulur)
# Elle çalıştır: GitHub > Actions > "Flutter APK" > Run workflow. Bitince GitHub > Releases > en yeni "APK" sürümünden app-release.apk'yı indir
# (artifact kotası özel depoda küçük olduğu için APK artık Release eki olarak yayımlanır; Release ekleri Actions kotasına girmez, dosya başına 2 GB sınırı var).
# Sabit imza anahtarı ve artan sürüm numarası sayesinde yeni APK eskisinin üstüne kurulur.
on:
  workflow_dispatch:
    inputs:
      sessiz:
        description: 'Sessiz sürüm (ses paketleri yok, ayrı uygulama kimliği ve adı: Hafız Dünyası (Sessiz))'
        type: boolean
        default: false
      webp:
        description: "PNG'leri kayıpsız WebP'ye çevir (boyut küçülür; kalite aynı). Sorun olursa kapat"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Disk aç (varlıklar çok büyük; derleme sırasında kopyalanıyor)
        working-directory: .
        run: |
          df -h / | tail -1 | while read -r l; do echo "::notice::disk önce: $l"; done
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/julia* /opt/az /usr/local/aws-cli /usr/share/miniconda /usr/local/graalvm \
            /opt/microsoft /usr/local/share/powershell /usr/local/share/chromium /opt/google /usr/lib/google-cloud-sdk || true
          df -h / | tail -1 | while read -r l; do echo "::notice::disk sonra: $l"; done
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sessiz sürüm hazırlığı (ses paketlerini çıkar, ad ve kimliği ayır)
        if: ${{ inputs.sessiz }}
        run: |
          rm -rf assets/paket/ses*
          sed -i '/assets\/paket\/ses[0-9]*\//d' pubspec.yaml
          grep -c "assets/paket/ses" pubspec.yaml || true
          sed -i 's|android:label="Hafız Dünyası"|android:label="Hafız Dünyası (Sessiz)"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|applicationId = "com.hafizdunyasi.gezgin"|applicationId = "com.hafizdunyasi.gezgin.sessiz"|' android/app/build.gradle.kts
          grep -n "label\|applicationId" android/app/src/main/AndroidManifest.xml android/app/build.gradle.kts | head
          du -sh assets | while read -r l; do echo "::notice::sessiz varlık boyutu: $l"; done
      - run: flutter pub get
      - name: "PNG'leri kayıpsız WebP'ye çevir (piksel piksel aynı, daha küçük; kapatılırsa PNG kalır)"
        if: ${{ inputs.webp }}
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          du -sm assets/paket | while read -r l; do echo "::notice::WebP öncesi paket: $l"; done
          python3 ../tools/webp_cevir.py > /tmp/webp.txt 2>&1 || { tail -30 /tmp/webp.txt; echo "::error::WebP dönüşümü başarısız"; exit 1; }
          tail -25 /tmp/webp.txt | while read -r l; do echo "::notice::$l"; done
          N=$(find assets/paket -name '*.webp' | wc -l)
          echo "::notice::WebP dosya sayısı: $N"
          if [ "$N" -lt 1000 ]; then sed 's/^/::error::/' /tmp/webp.txt | tail -30; echo "::error::WebP dönüşümü yapılmadı"; exit 1; fi
          du -sm assets/paket | while read -r l; do echo "::notice::WebP sonrası paket: $l"; done
      - name: APK derle
        run: |
          set +e
          if [ "${{ inputs.sessiz }}" = "true" ]; then EK="--dart-define=SESSIZ=true"; else EK=""; fi
          flutter build apk --release $EK --build-number=$((1000 + GITHUB_RUN_NUMBER)) > build.txt 2>&1
          kod=$?
          df -h / | tail -1 | while read -r l; do echo "::notice::disk: $l"; done
          if [ $kod -ne 0 ]; then
            grep -nE "What went wrong|Execution failed|FAILURE|error:|Error:|No space|OutOfMemory|Could not|Exception" -A2 build.txt | head -40 | while read -r l; do echo "::error::$l"; done
            tail -25 build.txt | while read -r l; do echo "::error::son: $l"; done
          fi
          exit $kod
      - name: APK'yı Release olarak yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ls -la build/app/outputs/flutter-apk/
          boyut=$(stat -c %s build/app/outputs/flutter-apk/app-release.apk)
          echo "::notice::APK boyutu: $boyut bayt ($((boyut/1048576)) MiB); Release sınırı 2048 MiB"
          if [ "${{ inputs.sessiz }}" = "true" ]; then
            ETIKET="sessiz-${GITHUB_RUN_NUMBER}"; BASLIK="SESSİZ APK ${GITHUB_RUN_NUMBER} (ses kaydı yok)"; DOSYA="hafiz-dunyasi-SESSIZ-${GITHUB_RUN_NUMBER}.apk"
          else
            ETIKET="apk-${GITHUB_RUN_NUMBER}"; BASLIK="APK ${GITHUB_RUN_NUMBER}"; DOSYA="app-release.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$DOSYA"
          gh release create "$ETIKET" "build/app/outputs/flutter-apk/$DOSYA" \
            --repo "$GITHUB_REPOSITORY" --title "$BASLIK" --notes "Elle derlendi (sürüm no $((1000 + GITHUB_RUN_NUMBER)))." --prerelease > rel.txt 2>&1
          kod=$?
          if [ $kod -ne 0 ]; then tail -8 rel.txt | while read -r l; do echo "::error::release: $l"; done; fi
          exit $kod
