name: Flutter APK (main)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/flutter_apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Kod kontrolü
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E "lib/|issue" analyze.txt | head -40 | while read -r l; do echo "::notice::$l"; done
          ! grep -qE "^ *error" analyze.txt
      - name: APK derle
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: HafizDunyasi-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
