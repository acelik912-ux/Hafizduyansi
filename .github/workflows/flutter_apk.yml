name: Flutter APK (telefona kurulur)
# Elle çalıştır: GitHub > Actions > "Flutter APK" > Run workflow. Bitince GitHub > Releases > en yeni "APK" sürümünden app-release.apk'yı indir
# (artifact kotası özel depoda küçük olduğu için APK artık Release eki olarak yayımlanır; Release ekleri Actions kotasına girmez, dosya başına 2 GB sınırı var).
# Sabit imza anahtarı ve artan sürüm numarası sayesinde yeni APK eskisinin üstüne kurulur.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: APK derle
        run: flutter build apk --release --build-number=$((1000 + GITHUB_RUN_NUMBER))
      - name: APK'yı Release olarak yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la build/app/outputs/flutter-apk/
          gh release create "apk-${GITHUB_RUN_NUMBER}" build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --title "APK ${GITHUB_RUN_NUMBER}" --notes "Elle derlendi (sürüm no $((1000 + GITHUB_RUN_NUMBER)))." --prerelease
