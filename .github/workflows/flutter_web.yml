name: Flutter Web (main)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/flutter_web.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Kod kontrolü
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E "error|issue" analyze.txt | head -10 | while read -r l; do echo "::notice::$l"; done
          ! grep -qE "^ *error" analyze.txt
      - name: Web derle
        run: flutter build web --release
      # Not: Web paketi (GB'larca varlık) özel depodaki Actions artifact kotasını (≈500 MB) aştığı için
      # artık yüklenmiyor; bu iş yalnızca "analiz + derleme geçiyor mu" kontrolüdür.
      - name: Derleme boyutu
        run: du -sh build/web
